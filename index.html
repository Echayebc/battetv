<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoriTV - IPTV Player</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:sans-serif;margin:0;padding:10px}
h1{text-align:center;color:#00d2ff}
#player{width:100%;height:300px;background:#000;border-radius:10px}
input{width:80%;padding:10px;border-radius:5px;border:none;margin:10px}
button{padding:10px 20px;background:#00d2ff;border:none;border-radius:5px;color:#000;font-weight:bold}
ul{list-style:none;padding:0}
li{padding:10px;background:#1a1a1a;margin:5px 0;border-radius:5px;cursor:pointer}
li:hover{background:#2a2a2a}
</style>
</head>
<body>
<h1>DoriTV</h1>
<video id="player" controls></video>
<div style="text-align:center">
<input id="m3uUrl" placeholder="حط رابط m3u هنا...">
<button onclick="loadM3U()">شغّل</button>
</div>
<ul id="list"></ul>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const player = document.getElementById('player');
const listEl = document.getElementById('list');

async function loadM3U(){
  const url = document.getElementById('m3uUrl').value;
  if(!url) return alert('حط رابط!');
  const res = await fetch(url);
  const text = await res.text();
  const lines = text.split('\n');
  listEl.innerHTML='';
  let title='';
  lines.forEach(line=>{
    if(line.startsWith('#EXTINF')){ title=line.split(',')[1]||'قناة'; }
    else if(line.startsWith('http')){
      const li=document.createElement('li');
      li.textContent=title;
      li.onclick=()=>playChannel(line);
      listEl.appendChild(li);
    }
  });
}
function playChannel(url){
  if(Hls.isSupported()){
    const hls=new Hls(); hls.loadSource(url); hls.attachMedia(player); hls.on(Hls.Events.MANIFEST_PARSED,()=>player.play());
  } else { player.src=url; player.play(); }
}
</script>
</body>
</html>
