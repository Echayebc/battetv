name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Find gradlew
        run: |
          find . -name "gradlew" -type f
          ls -la
          ls -la app/ || echo "no app folder"
      - name: Grant permission
        run: |
          chmod +x ./gradlew || chmod +x app/gradlew || echo "no gradlew found"
      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug; elif [ -f "app/gradlew" ]; then cd app && ./gradlew assembleDebug; else echo "Gradle not found, this is not Android project"; exit 1; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BatteTV-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
